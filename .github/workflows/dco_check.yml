---
name: DCO Check

on:
  pull_request:

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the full PR commit range to validate every commit.
          fetch-depth: 0
      # The former tim-actions/dco@master action is abandonware and fails on
      # current runners ("Unexpected end of JSON input"). This inline check is
      # an equivalent DCO validation: every commit in the PR must carry a
      # Signed-off-by trailer.
      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "Missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more commits lack a Signed-off-by line (DCO). Use 'git commit -s'."
            exit 1
          fi
          echo "All commits in the PR are signed off (DCO)."
