[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redgnat"
version = "0.1.0"
description = "Continuous Automated Red Teaming module for GNAT"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "RedGNAT Contributors" }]
keywords = ["red-team", "adversary-emulation", "threat-intelligence", "MITRE-ATT&CK", "CART"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    # NOTE: the GNAT platform library is an optional integration — every import
    # of it in this package is lazy and guarded. It is not published to public
    # PyPI, so it lives in the [gnat] extra (install `redgnat[gnat]`, or provide
    # it via a private index) rather than as a hard dependency that would break
    # `pip install` in environments without access to it.
    "psycopg[binary]>=3.1",  # PostgreSQL driver (matches SandGNAT convention)
    "celery[redis]>=5.3",    # Async task queue
    "fastapi>=0.111",        # REST management API
    "uvicorn[standard]>=0.29", # ASGI server
    "urllib3>=2.2",          # HTTP client (no requests — matches GNAT)
    "stix2>=3.0",            # STIX 2.1 objects for result export
]

[project.optional-dependencies]
gnat = [
    "gnat>=1.5.0",           # Core GNAT library (connectors, ORM, agents)
]
discovery = [
    "python-nmap>=0.7",      # nmap subprocess wrapper (T1046, T1595.001)
    "ldap3>=2.9",            # LDAP enumeration (T1087, T1069, T1482)
    "boto3>=1.34",           # AWS enumeration (T1087.004, T1069.003)
    "msal>=1.28",            # Microsoft identity (Entra/Azure AD)
]
phishing = [
    "python-docx>=1.1",      # Phishing template rendering
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-urllib3",
    "httpx>=0.27",           # Test async client
]
all = ["redgnat[discovery,phishing,gnat]"]

[project.scripts]
redgnat = "redgnat.cli:main"

[project.entry-points."gnat.connectors"]
redgnat = "redgnat.plugins.gnat_plugin:RedGNATConnector"

[tool.setuptools.packages.find]
where = ["."]
include = ["redgnat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "integration: requires live credentials and network access",
    "slow: tests taking >5s",
]

[tool.coverage.run]
source = ["redgnat"]
omit = ["tests/*", "redgnat/cli.py"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length handled by the formatter.
# UP042: the dataclass-ORM enums intentionally use (str, Enum) rather than
# StrEnum for explicit .value serialization; this is a deliberate convention.
ignore = ["E501", "UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom: Depends()/Body()/Query()/Header() are
# intentionally used as argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pylint.main]
# Optional/lazy-imported integrations are not installed in lint envs; don't
# treat their imports as errors.
ignored-modules = ["gnat", "gnat.agents", "gnat.reports", "ldap3", "nmap", "boto3"]
# The codebase deliberately uses lazy imports (to keep optional deps optional
# and break import cycles) and shares result-shaping across parallel technique
# modules; enforce overall quality via a score floor rather than chasing a
# perfect 10/10.
fail-under = 8.5

[tool.pylint.format]
# Line length is governed by ruff (E501 there); keep pylint from duplicating it.
max-line-length = 100
